  "ingress": "Kalmar Tennisklubb bildades 1914 och är idag en samlingsplats för tennis, padel, pickleball, gym, kurser, tävlingar och socialt klubbspel.",
  "text1": "Kalmar Tennisklubb ligger i ett naturskönt område bara några hundra meter från Kalmarsund och Ölandsbron. Bad, minigolf, ströv- och motionsområden och Kalmar centrum finns i närheten. Vi är idag en av de största klubbarna i Småland med över 900 medlemmar, varav cirka 300 är ungdomar i juniorträningen.",
